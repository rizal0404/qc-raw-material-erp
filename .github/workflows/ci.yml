name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: qc_raw_material_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qc_raw_material_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/qc_raw_material_ci
      MIGRATION_DATABASE_SSL: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.0.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:verify
      - run: pnpm db:migrate
      - run: pnpm db:verify
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
